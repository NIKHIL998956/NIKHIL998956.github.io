<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil | Python Developer</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117; /* GitHub Dark Theme Color */
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            width: 350px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #58a6ff;
        }

        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            color: #f0f6fc;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .title {
            color: #8b949e;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .badge {
            background: #238636;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .download-btn {
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: 0.2s;
        }

        .download-btn:hover {
            background-color: #58a6ff;
            color: white;
            border-color: #58a6ff;
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="profile.jpg" alt="Nikhil" class="profile-pic">
        
        <h1>Nikhil</h1>
        <p class="title">Python Software Developer</p>

        <div class="badge-container">
            <span class="badge">Django</span>
            <span class="badge">API</span>
            <span class="badge">Python</span>
        </div>

        <a href="resume.pdf" download class="download-btn">
            Download Resume
        </a>
    </div>

</body>
</html>
