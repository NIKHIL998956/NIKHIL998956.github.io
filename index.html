
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil | Python Software Developer</title>
    <style>
        /* This makes the page look modern and clean */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .profile-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        /* The Circle Photo */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3776ab; /* Python Blue Color */
            margin-bottom: 20px;
        }
        h1 { margin: 10px 0; color: #2c3e50; }
        p { color: #7f8c8d; font-size: 1.1em; }
        
        /* The Resume Button */
        .download-btn {
            display: inline-block;
            margin-top: 25px;
            background-color: #3776ab; /* Python Blue */
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background-color: #2b5b87;
        }
        .tech-stack {
            margin-top: 15px;
            font-size: 0.9em;
            color: #3776ab;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="profile.jpg" alt="Nikhil" class="profile-img">
        
        <h1>Nikhil</h1>
        <p>Python Software Developer</p>
        <div class="tech-stack">Django | Flask | PostgreSQL | Rest API</div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <a href="resume.pdf" download="Nikhil_Python_Developer_Resume" class="download-btn">
            📥 Download My Resume
        </a>
    </div>

</body>
</html>
